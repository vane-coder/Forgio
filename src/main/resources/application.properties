# ============================================================
# Forgio Backend – Application Configuration
# ============================================================

server.port=${PORT:8080}
# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/forgio_db
spring.datasource.username=${DB_USERNAME:majestycomaa}
spring.datasource.password=${DB_PASSWORD:VFREJpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ──────────────────────────────────────────────────────
forgio.jwt.secret=${JWT_SECRET:forgio-secret-key-must-be-at-least-256-bits-long-for-hs256}
forgio.jwt.access-token-expiration=86400000
forgio.jwt.refresh-token-expiration=604800000

# ── Firebase FCM ─────────────────────────────────────────────
forgio.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

# ── Claude AI (Anthropic) — fallback used if key is blank ────
forgio.claude.api-key=${CLAUDE_API_KEY:}
forgio.claude.model=claude-sonnet-4-6
forgio.claude.base-url=https://api.anthropic.com/v1/messages
forgio.claude.max-tokens=1024

# ── OpenWeatherMap ───────────────────────────────────────────
forgio.weather.api-key=${OPENWEATHER_API_KEY:}
forgio.weather.base-url=https://api.openweathermap.org/data/2.5

# ── Google Maps (GPS Tracking) ───────────────────────────────
forgio.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ── SMS (Africa's Talking) ───────────────────────────────────
forgio.sms.provider=africastalking
forgio.sms.africastalking.username=${AT_USERNAME:sandbox}
forgio.sms.africastalking.api-key=${AT_API_KEY:}
forgio.sms.africastalking.sender-id=${AT_SENDER_ID:}

# ── OTP ─────────────────────────────────────────────────────
forgio.otp.length=6
forgio.otp.expiry-minutes=5
forgio.otp.max-attempts=5
forgio.otp.rate-limit-count=3
forgio.otp.rate-limit-window-minutes=10

# ── Logging ──────────────────────────────────────────────────
logging.level.com.forgio=DEBUG
logging.level.org.springframework.security=WARN

# ── Paystack ─────────────────────────────────────────────────
forgio.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
forgio.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
forgio.paystack.callback-url=${PAYSTACK_CALLBACK_URL:https://forgio-backend.onrender.com/api/v1/marketplace/transactions/callback}


# ── Brevo Mail Configuration (HTTP) ─────────────────────────

forgio.brevo.api-key=${BREVO_API_KEY}
forgio.brevo.from-email=${BREVO_FROM_EMAIL}
forgio.brevo.from-name=${BREVO_FROM_NAME:Forgio}